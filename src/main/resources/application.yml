# 服务器配置
server:
  port: 8081

# 数据源配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/street_map?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456  # ⚠️ 改成你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 配置（如果使用 JPA）
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.streetmap.backend.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:test-secret-key-must-be-at-least-32-characters-long-for-security}
  expiration: 86400000

# 微信配置
wechat:
  appid: wx6fb55954dff3e5e7
  secret: ${WECHAT_APP_SECRET:7e1c685b2302674beb378bf7ccb145d2}

# 日志配置
logging:
  level:
    com.streetmap.backend: debug
    com.mysql: debug

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.streetmap.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0